<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<style>
  text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .muted { fill: #59636e; }
  .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
  
  @keyframes link { 0%,38% { stroke:#0e7c66; stroke-dasharray:0; } 40%,78% { stroke:#cf222e; stroke-dasharray:9 7; } 80%,100% { stroke:#0e7c66; stroke-dasharray:0; } }
  @keyframes x { 0%,38% { opacity:0 } 40%,78% { opacity:1 } 80%,100% { opacity:0 } }
  @keyframes on { 0%,38% { opacity:1 } 40%,78% { opacity:0 } 80%,100% { opacity:1 } }
  @keyframes q { 0%,40% { transform:scaleX(0.02) } 78% { transform:scaleX(1) } 92%,100% { transform:scaleX(0.02) } }
  @keyframes up { 0%,38% { opacity:1 } 40%,79% { opacity:0 } 80%,100% { opacity:1 } }
  @keyframes upmove { 0% { transform:translateX(0) } 100% { transform:translateX(200px) } }
  .link { animation: link 12s linear infinite; }
  .x { animation: x 12s linear infinite; }
  .on { animation: on 12s linear infinite; }
  .off { animation: x 12s linear infinite; }
  .q { transform-origin: 360px 0; transform-box: view-box; animation: q 12s ease-in-out infinite; }
  .upw { animation: up 12s linear infinite; }
  .u { animation: upmove 1s linear infinite; }
  .u2 { animation: upmove 1s linear 0.5s infinite; }

</style>
