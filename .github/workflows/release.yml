# Cross-platform release artifacts: Linux .deb/.rpm (x86_64, aarch64), Windows .msi, checksums, GitHub Release.
# Triggered by pushing a version tag (v1.2.3). The release notes are that tag's CHANGELOG.md section,
# verbatim; a tag without one fails before anything is built. workflow_dispatch must be run on a tag.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release notes are this tag's CHANGELOG.md section, copied verbatim. Extracted first so
  # a tag without a section fails in seconds, before any package is built or anything is
  # published.
  notes:
    name: Release notes from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER="## [${VERSION}]"
          awk -v header="$HEADER" '
            index($0, header) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error file=CHANGELOG.md::No '${HEADER}' section with content; add it before tagging ${GITHUB_REF_NAME}."
            exit 1
          fi
          cat release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  linux:
    name: Linux ${{ matrix.arch }} (.deb, .rpm)
    needs: notes
    # Native runners per architecture: aws-lc-rs and bundled SQLite compile C, and a native
    # arm64 build avoids maintaining a cross toolchain for them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p apex-edge

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build .deb package
        run: cargo deb -p apex-edge --no-build

      - name: Build .rpm package
        run: cargo generate-rpm -p apex-edge

      - name: Collect and checksum Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/debian/*.deb dist/
          find target -iname "*.rpm" -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS-linux-${{ matrix.arch }}.txt
          ls -la

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-edge-linux-${{ matrix.arch }}
          path: dist/

  windows:
    name: Windows (.msi)
    needs: notes
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build .msi package
        shell: pwsh
        run: cargo wix -p apex-edge --nocapture --bin-path "$env:WIX\bin"

      - name: Collect and checksum Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target/wix -iname "*.msi" -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS-windows.txt
          ls -la

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-edge-windows
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [notes, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -iname "*.deb" -o -iname "*.rpm" -o -iname "*.msi" -o -iname "SHA256SUMS-*" \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: artifacts/release-notes/release_notes.md
