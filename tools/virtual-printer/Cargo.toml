[package]
name = "virtual-printer"
version = "0.1.0"
edition = "2021"
description = "Decodes an ESC/POS or Star Line Mode byte stream on port 9100 and renders the receipt in a browser."

[[bin]]
name = "virtual-printer"
path = "src/main.rs"

[dependencies]
apex-edge-adapters-hardware = { path = "../../crates/adapters/hardware" }
axum = { version = "0.7", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
